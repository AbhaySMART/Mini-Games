<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kind Kingdom Mini Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=32">
</head>
<body>
  <main class="dashboard">
    <section class="dashboard-hero">
      <h1>Heart of the Kingdom Mini Games</h1>
    </section>
    <section id="dashboard-featured" class="dashboard-featured" aria-label="Featured game of the week"></section>
    <section id="skill-filters" class="skill-filters" aria-label="Search and filter mini games"></section>
    <section id="recommendation-panel" class="recommendation-panel" aria-label="Recommended game"></section>
    <section class="map-shell" aria-label="Kind Kingdom story map">
      <section id="game-grid" class="game-grid map-grid" aria-label="Mini game dashboard"></section>
    </section>
    <section id="coming-soon" class="coming-soon" aria-label="Coming soon mini games"></section>
  </main>

  <script src="data.js?v=32"></script>
  <script src="dashboard.js?v=32"></script>
</body>
</html>
